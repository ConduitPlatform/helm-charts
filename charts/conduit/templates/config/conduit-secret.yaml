apiVersion: v1
kind: Secret
metadata:
  name: conduit-secret
data:
  MASTER_KEY: {{ template "conduit-helm.master_key" . }}
  {{- if .Values.global.secret.grpc_enable }}
  GRPC_KEY: {{ template "conduit-helm.grpc_key" . }}
  {{- end }}
  {{- $embeddingsApiKey := include "conduit-helm.embeddings.providerApiKey" . | trim }}
  {{- if and .Values.install.embeddings.enabled $embeddingsApiKey }}
  "providers.openai-compatible.apiKey": {{ $embeddingsApiKey }}
  {{- end }}
