{{- if .Values.mongodb.enabled  -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "conduit-helm.mongodb.fullname" . }} 
  annotations:
    {{- with .Values.mongodb.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}  
  labels:
{{ include "conduit-helm.labels" . | indent 4 }}
    app: {{ template "conduit-helm.mongodb.fullname" . }}
spec:
  replicas: {{ .Values.mongodb.replicas }}
  selector:
    matchLabels:
      app: {{ template "conduit-helm.mongodb.fullname" . }}
  template:
    metadata:
      labels:
{{ include "conduit-helm.podLabels" (dict "root" . "app" (include "conduit-helm.mongodb.fullname" .) "extra" .Values.mongodb.podLabels) | indent 8 }}
      {{- if .Values.mongodb.podAnnotations }}
      annotations:
        {{- toYaml .Values.mongodb.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      {{- include "conduit-helm.podSecurityContext" (dict "root" . "component" .Values.mongodb) | nindent 6 }}
      {{- with .Values.mongodb.initContainers }}
      initContainers:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
        - name: {{ .Values.mongodb.name }}
          image: {{ include "conduit-helm.image" (dict "repository" .Values.mongodb.image.name "tag" .Values.mongodb.image.tag "digest" .Values.mongodb.image.digest) }}
          imagePullPolicy: {{ .Values.mongodb.image.imagePullPolicy }}
          {{- include "conduit-helm.containerSecurityContext" (dict "root" . "component" .Values.mongodb) | nindent 10 }}
          command:
            {{- with .Values.mongodb.extraArgs }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.mongodb.port }}
          {{- with .Values.mongodb.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mongodb.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- with .Values.mongodb.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.mongodb.extraContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- with .Values.mongodb.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "conduit-helm.podScheduling" (dict "root" . "component" .Values.mongodb) | nindent 6 }}
{{- end }}