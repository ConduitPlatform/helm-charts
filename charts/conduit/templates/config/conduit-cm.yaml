apiVersion: v1
kind: ConfigMap
metadata:
  name: conduit-cm
data:
  METRICS_PORT: {{ .Values.global.config.metrics_port | quote }}
  CONDUIT_SERVER: {{ include "conduit-helm.resourceName" (dict "prefix" (include "conduit-helm.core.fullname" .) "suffix" "headless") }}:{{ .Values.core.service.grpc_port }}
  {{- if or .Values.loki.setup .Values.externalLoki.url }}
  LOKI_URL: {{ template "conduit-helm.loki.url" . }}
  {{- end }}
