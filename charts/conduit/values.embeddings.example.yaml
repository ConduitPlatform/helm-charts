# Overlay: embeddings + Storage, convict workers still off.
# Set image.tag to a published embeddings tag (not Chart.appVersion).
# Then follow ConfigMap APPLY.txt: PATCH /config/embeddings and GET read-back.
#
# helm upgrade --install conduit ./charts/conduit \
#   -f values.embeddings.example.yaml \
#   --set install.embeddings.image.tag=<published-tag>

global:
  secret:
    grpc_enable: true

install:
  storage:
    enabled: true
  embeddings:
    enabled: true
    requireStorage: true
    image:
      tag: dev
    config:
      providers:
        openai-compatible:
          endpoint: "https://api.openai.com/v1/embeddings"
          models:
            - name: text-embedding-3-small
              dimensions: 1536
          defaultModel: text-embedding-3-small
